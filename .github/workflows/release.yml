name: Build release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MacBridgeWin.sln

      - name: Build
        run: dotnet build MacBridgeWin.sln -c Release --no-restore

      - name: Test
        run: dotnet test MacBridgeWin.sln -c Release --no-build --verbosity normal

      - name: Restore Windows release runtime
        run: dotnet restore src\MacBridgeWin.App\MacBridgeWin.App.csproj -r win-x64

      - name: Publish self-contained Windows build
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          dotnet publish src\MacBridgeWin.App\MacBridgeWin.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:Version=$version `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o artifacts\publish

      - name: Verify single-file output
        shell: pwsh
        run: |
          $files = @(Get-ChildItem artifacts\publish -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne "MacBridgeWin.App.exe") {
            $names = $files.Name -join ", "
            throw "Expected only MacBridgeWin.App.exe, found: $names"
          }

      - name: Package and checksum
        shell: pwsh
        run: |
          $archive = "MacBridgeWin-${{ github.ref_name }}-win-x64.zip"
          Compress-Archive -Path artifacts\publish\* -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          Set-Content -Path "$archive.sha256" -Value "$hash  $archive" -Encoding ascii

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = "MacBridgeWin-${{ github.ref_name }}-win-x64.zip"
          gh release create "${{ github.ref_name }}" $archive "$archive.sha256" `
            --title "MacBridgeWin ${{ github.ref_name }}" `
            --generate-notes `
            --verify-tag
