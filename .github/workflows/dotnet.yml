name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore MacBridgeWin.sln
      - name: Build
        run: dotnet build MacBridgeWin.sln -c Release --no-restore
      - name: Test
        run: dotnet test MacBridgeWin.sln -c Release --no-build --verbosity normal
